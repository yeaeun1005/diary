<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<title>감정일기 웹앱 — Russell 28 + 한국어 어미/강도 + 누적</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { color-scheme: light; }

  .btn-primary{background:#4f46e5; color:#fff}

  .btn-warn{background:#fde68a; color:#111827}

<body>
<div class="wrap">
  <h1>감정일기 웹앱 (Russell 28 + 한국어 어미/강도 + 누적)</h1>
  <p class="muted">각 줄에 <b>날짜 + 공백 + 내용</b> (예: <code>9.1 너무 피곤했지만 아주 뿌듯했다</code>) 로 입력하고 <b>분석 실행</b>을 누르세요.</p>

  <div class="row">
    <div class="col">
      <div class="card">
        <textarea id="diaryInput" placeholder="예) 9.1 너무 피곤했지만 아주 뿌듯했다&#10;9.2 조금 슬펐는데 금방 기뻤다"></textarea>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px">

          <button id="btnFlush" class="btn btn-warn">누적 비움</button>
        </div>
        <div class="opts" style="margin-top:8px">
          <label><input id="accumulate" type="checkbox" checked> 일기 입력을 누적 저장 (브라우저 로컬, 7개 점 표시 권장)</label>
          <label><input id="limit7" type="checkbox" checked> 차트는 최근 7개 기록만 사용</label>
          <label><input id="useExtraLexicon" type="checkbox" checked> 추가 긍/부정 단어 목록(문장형) 반영 → 타임라인 비율</label>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <div id="summary" class="muted">분석 결과 요약이 여기에 표시됩니다.</div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <b>타임라인 (긍/부정 비율)</b>
        <div style="position:relative">
          <canvas id="timelineChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="charts" style="margin-top:16px">
    <div class="card">
      <b>러셀 원형 — 28 감정 앵커 & 일기 평균점</b>

      </div>
      <div class="muted" style="font-size:12px; margin-top:6px">원(반지름=1), x=Valence(쾌/불쾌), y=Arousal(각성/이완). 앵커는 회색, 각 일기 평균점은 파란/빨간 점.</div>
    </div>
    <div class="card">
      <b>디버그 · 매칭 단어</b>
      <pre id="debugBox" style="white-space:pre-wrap; margin:0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; color:#1f2937"></pre>
    </div>
  </div>
</div>

<script>
/* ===============================
   0) 공통 유틸 / 로컬 저장
=============================== */
const $ = (q)=>document.querySelector(q);
const LS_KEY = 'emotionDiaryLinesV1';
function loadStoredLines(){ try{ const raw=localStorage.getItem(LS_KEY); return raw? JSON.parse(raw) : []; }catch{ return []; } }
function saveStoredLines(lines){ try{ localStorage.setItem(LS_KEY, JSON.stringify(lines)); }catch{} }
function addLinesToStore(newLines){ const cur=loadStoredLines(); const merged=cur.concat(newLines); saveStoredLines(merged); return merged; }
function clearStoredLines(){ try{ localStorage.removeItem(LS_KEY);}catch{} }

function resetCanvas(id){
  const old = document.getElementById(id);
  if(!old) return null;
  const p = old.parentNode;
  const neo = old.cloneNode(false);
  p.replaceChild(neo, old);
  return neo.getContext('2d');
}

/* ===============================
   1) 한국어 전처리 / 스테밍 / 강도
=============================== */
function normalizeKorean(text){
  return (text||'')
    .replace(/[.,!?;:"'`~\[\]\(\)\{\}<>\/\|\\\-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// 자주 쓰이는 동사/형용사 어미·어간 변형을 소거(간단 스테밍)
const ENDINGS = [
  "했습니다","했습니까","했습니다만","했습니다요","했습니다요","했어요","했어","했다","하였다",
  "하세요","하셨다","하시네요","하네요","하네","하자","한다","한다는","한다고","한다면","한다면요","한다니까",
  "합니다","합니까","합니다만","해요","해","함","했네요","했던","했을","하게","하게요","하였음","하였다가",
  "스럽다","스러웠다","스러워요","스러웠어요","스럽네요","스럽고","스럽지만"
];
function stemKorean(w){
  let s = w;
  for(const e of ENDINGS){ if(s.endsWith(e)) return s.slice(0, -e.length); }
  return s;
}

// 강도 수식어

/* ===============================
   4) 감정 인식 (Russell 28 + 추가사전 가중치)
=============================== */
// Russell 28 매칭 (형태가 조금 달라도 포함 매칭)
function analyzeRussell(text){
  const toks = normalizeKorean(text).split(' ').filter(Boolean);
  const hits = [];
  for(const t of toks){
    const st = stemKorean(t);
    for(const [kw, info] of KW2COORD.entries()){
      if(st.includes(kw)){ // 부분 포함 매칭
        hits.push({ token:t, name:info.name, val9:info.v9, aro9:info.a9,
                    val_std:nineToStd(info.v9), aro_std:nineToStd(info.a9) });
        break;
      }
    }
  }
  const vals = hits.map(h=>h.val9), aros = hits.map(h=>h.aro9);
  const val9 = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 5;
  const aro9 = aros.length? aros.reduce((a,b)=>a+b,0)/aros.length : 5;
  return {
    val9, aro9, val_std:nineToStd(val9), aro_std:nineToStd(aro9),
    hits, matched_emotions: hits.map(h=>h.name).join(',')
  };
}

// 추가 사전(문장형) + 강도 가중치 → 타임라인 비율에만 사용
function detectWeightedSentiments(text, posList, negList){
  const tokens = normalizeKorean(text).split(' ').filter(Boolean);
  let pos=0, neg=0; const matchedPos=[], matchedNeg=[];
  let currentWeight = 1.0;

  for(const raw of tokens){
    const stem = stemKorean(raw);
    if (STRENGTH_MODIFIERS.strong.includes(stem)){ currentWeight=2.0; continue; }
    if (STRENGTH_MODIFIERS.weak.includes(stem)){ currentWeight=0.5; continue; }

    let found = false;
    for (const w of posList){
      if(stem.includes(stemKorean(w))){ pos += currentWeight; matchedPos.push(`${w}(${currentWeight}x)`); found = true; break; }
    }
    if(found){ currentWeight = 1.0; continue; }
    for (const w of negList){
      if(stem.includes(stemKorean(w))){ neg += currentWeight; matchedNeg.push(`${w}(${currentWeight}x)`); found = true; break; }
    }
    if(found){ currentWeight = 1.0; }
  }
  return {pos,neg,matchedPos,matchedNeg};
}

/* ===============================
   5) 메인 분석 흐름
=============================== */
let chartTimeline=null, chartCircumplex=null;
let RESULTS = { rows: [], hits: [] };

function parseLine(line){
  const trimmed = line.trim();
  if(!trimmed) return null;
  const sp = trimmed.split(' ');
  if(sp.length<2) return null;
  const date = sp[0]; // 9.1 또는 2025.09.01
  const text = sp.slice(1).join(' ');
  return {date, text};
}

function analyze(){
  const linesNew = ($('#diaryInput').value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const doAccum = $('#accumulate').checked;
  let effective = linesNew;

  if(doAccum){
    effective = addLinesToStore(linesNew);
    $('#diaryInput').value = '';
  }

  const rowsAll = [];
  const debugLines = [];

  for(const line of effective){
    const parsed = parseLine(line);
    if(!parsed) continue;

    // (a) Russell 28로 평균 좌표 + 히트 리스트
    const r28 = analyzeRussell(parsed.text);

    // (b) 추가 사전 + 강도 가중치로 긍/부정 비율
    let pos=0,neg=0,matchedPos=[],matchedNeg=[];
    if($('#useExtraLexicon').checked){
      const ex = detectWeightedSentiments(parsed.text, POS_EXTRA, NEG_EXTRA);
      pos = ex.pos; neg = ex.neg; matchedPos = ex.matchedPos; matchedNeg = ex.matchedNeg;
    }
    // Russell 히트도 긍/부정 집계에 포함하고 싶다면(선택): v>5 → pos++, v<5 → neg++
    for(const h of r28.hits){
      if(h.val9>5) pos += 1;
      else if(h.val9<5) neg += 1;
    }

    const total = pos+neg;
    const posPct = total? (pos/total*100) : 0;
    const negPct = total? (neg/total*100) : 0;

    rowsAll.push({
      date: parsed.date,
      posPct, negPct,
      val_std: r28.val_std, aro_std: r28.aro_std,
      matched_emotions: r28.matched_emotions,
      matched_pos_extra: matchedPos.join(','),
      matched_neg_extra: matchedNeg.join(',')
    });

    debugLines.push(`📅 ${parsed.date}
- Russell hits: ${r28.matched_emotions||'(none)'} / avg (v=${r28.val9.toFixed(2)}, a=${r28.aro9.toFixed(2)})
- Extra + weight: +${pos.toFixed(2)} / -${neg.toFixed(2)} → ${posPct.toFixed(1)}% / ${negPct.toFixed(1)}%
- Extra matched +: ${matchedPos.join(', ')||'(none)'}
- Extra matched -: ${matchedNeg.join(', ')||'(none)'}\n`);
  }

  rowsAll.sort((a,b)=> a.date.localeCompare(b.date));
  const rows = $('#limit7').checked ? rowsAll.slice(-7) : rowsAll;

  RESULTS.rows = rows;
  $('#debugBox').textContent = debugLines.join('\n');

  renderTimeline();
  renderCircumplex();
  renderSummary();
}

function renderSummary(){
  const n = RESULTS.rows.length;
  if(!n){ $('#summary').textContent = '아직 분석 결과가 없습니다. 일기를 입력하고 [분석 실행]을 누르세요.'; return; }
  const avgPos = RESULTS.rows.reduce((s,r)=>s+r.posPct,0)/n;
  const avgNeg = RESULTS.rows.reduce((s,r)=>s+r.negPct,0)/n;
  $('#summary').innerHTML = `최근 <b class="kpi">${n}</b>개 일기 평균 → 
    긍정 <b class="kpi">${avgPos.toFixed(1)}%</b>, 부정 <b class="kpi">${avgNeg.toFixed(1)}%</b>`;
}

/* ===============================
   6) 차트 — 타임라인 / 러셀 원형
=============================== */
function renderTimeline(){
  const ctx = resetCanvas('timelineChart');
  if(chartTimeline){ try{ chartTimeline.destroy(); }catch{} }

  const labels = RESULTS.rows.map(r=>r.date);
  const pos = RESULTS.rows.map(r=>+r.posPct.toFixed(2));
  const neg = RESULTS.rows.map(r=>+r.negPct.toFixed(2));

  chartTimeline = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'긍정 %', data:pos, tension:.25 },
        { label:'부정 %', data:neg, tension:.25 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index', intersect:false},
      plugins:{ legend:{position:'bottom'} },
      scales:{ y:{beginAtZero:true, max:100} }
    }
  });
}

function renderCircumplex(){
  const ctx = resetCanvas('circumplexChart');
  if(chartCircumplex){ try{ chartCircumplex.destroy(); }catch{} }

  // 28 감정 앵커(회색) + 일기 평균점(긍/부정 색)
  const anchorData = EMOTIONS_28.map(e=>({
    x: nineToStd(e.val_9), y: nineToStd(e.aro_9), label: e.name
  }));
  const diaryData = RESULTS.rows.map(r=>({
    x: r.val_std, y: r.aro_std,
    date: r.date, color: r.posPct>=r.negPct ? '#3b82f6' : '#ef4444',
    radius: Math.max(4, Math.min(12, (r.posPct/100)*10 + 4))
  }));

  chartCircumplex = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          label:'Russell 28 앵커',
          data: anchorData,
          pointRadius: 3,
          backgroundColor: 'rgba(100,116,139,.6)'
        },
        {
          label:'일기 평균점',
          data: diaryData.map(d=>({x:d.x, y:d.y})),
          pointRadius: diaryData.map(d=>d.radius),
          backgroundColor: diaryData.map(d=>d.color)
        }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      scales:{
        x:{ type:'linear', min:-1.05, max:1.05, title:{display:true, text:'Valence (− ← → +)'} },
        y:{ type:'linear', min:-1.05, max:1.05, title:{display:true, text:'Arousal (↓ ← → ↑)'} }
      },
      plugins:{
        legend:{position:'bottom'},
        tooltip:{
          callbacks:{
            label(ctx){
              if(ctx.datasetIndex===0){
                const a = anchorData[ctx.dataIndex];
                return `앵커: ${a.label} (v:${ctx.parsed.x.toFixed(2)}, a:${ctx.parsed.y.toFixed(2)})`;
              }else{
                const d = diaryData[ctx.dataIndex];
                return `${d.date} (v:${ctx.parsed.x.toFixed(2)}, a:${ctx.parsed.y.toFixed(2)})`;
              }
            }
          }
        }
      }
    }
  });

  // 원형 가이드(원/축선)는 Chart.js 기본 그리드로 대체. 원을 추가로 그리고 싶다면 annotation 플러그인 사용 가능.
}

/* ===============================
   7) 이벤트 바인딩
=============================== */
$('#btnAnalyze').addEventListener('click', analyze);
$('#btnFlush').addEventListener('click', ()=>{
  clearStoredLines();
  $('#diaryInput').value='';
  RESULTS = {rows:[], hits:[]};
  if(chartTimeline) chartTimeline.destroy();
  if(chartCircumplex) chartCircumplex.destroy();
  $('#summary').textContent='누적 기록을 비웠습니다.';
  $('#debugBox').textContent='';
});
</script>
